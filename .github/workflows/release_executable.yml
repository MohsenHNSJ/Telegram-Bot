---
name: Build Linux and release

on:
    push:
        branches:
            - main
permissions:
    contents: write # Needed to create releases and upload assets

jobs:
    build-linux:
        name: Build Linux executable with PyInstaller
        runs-on: ubuntu-latest

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
              with:
                  egress-policy: audit # Monitor outbound connections

            - name: Check out the repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0 # Fetch all history for version detection

            - name: Ensure Poetry cache directory exists
              run: mkdir -p ~/.cache/pypoetry

            - name: Cache pip
              id: cache-pip
              uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Print pip cache status
              run: |
                  echo "pip cache hit: ${{ steps.cache-pip.outputs.cache-hit }}"

            - name: Cache Poetry
              id: cache-poetry
              uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
              with:
                  path: ~/.cache/pypoetry
                  key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-poetry-

            - name: Print Poetry cache status
              run: |
                  echo "poetry cache hit: ${{ steps.cache-poetry.outputs.cache-hit }}"

            - name: Set up the environment
              uses: ./.github/actions/setup-poetry-env
              with:
                  py-installer: true
                  upx: true
                  install-package: true

            - name: Check if there is a parent commit
              id: check-parent-commit
              run: |
                  parent_sha=$(git rev-parse --verify HEAD^ 2>/dev/null || echo "")
                  echo "Parent commit SHA: $parent_sha"
                  if [ -n "$parent_sha" ]; then
                      echo "sha=$parent_sha" >> $GITHUB_OUTPUT
                  fi

            - name: Detect and tag new version
              id: check-version
              if: steps.check-parent-commit.outputs.sha
              uses: salsify/action-detect-and-tag-new-version@v2
              with:
                  version-command: |
                      version=$(poetry version | awk '{print $2}')
                      echo $version

            - name: Build single-file Linux executable with PyInstaller (UPX compression, INFO log)
              run: |
                  set -e
                  if ! command -v pyinstaller &> /dev/null; then
                      echo "PyInstaller not found"
                      exit 1
                  fi

                  pyinstaller \
                    --clean \
                    --windowed \
                    --noconfirm \
                    --onefile \
                    --log-level INFO \
                    --name VaMoTelBot \
                    --optimize 2 \
                    src/vamo_telbot/main.py

            - name: Upload build artifact File
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  # Artifact name
                  name: VaMoTelBot
                  # Path to executable
                  path: dist/VaMoTelBot
                  # Compression level (0-9)
                  compression-level: 9
                  # Raise error on no files found
                  if-no-files-found: error

            - name: Publish the release notes
              id: create_release
              uses: release-drafter/release-drafter@6db134d15f3909ccc9eefd369f02bd1e9cffdf97 # v6.2.0
              with:
                  # Publish the release
                  publish: true
                  tag: ${{ steps.check-version.outputs.tag }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Assets to Release
              uses: csexton/release-asset-action@3567794e918fa3068116688122a76cdeb57b5f09 # v3
              with:
                  file: dist/VaMoTelBot
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  release-url: ${{ steps.create_release.outputs.upload_url }}
