---
name: DustiLock Scanner

on:
  push: # Run on every Push
  pull_request:
    # Run on every PR

permissions:
  contents: read

jobs:
  dustilock:
    name: Run DustiLock
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit # Monitor outbound connections

      - name: Checkout the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run DustiLock to check for dependency confusion attacks
        uses: checkmarx/dustilock@9a0cc4fe3da93f7efb38679896c074dc94d60ac6 # v1.2.0
        with:
          recursive: true # Scan all subdirectories for lock files
